<!DOCTYPE html>
<html lang="de">
<!-- Weiterleitung. Die Referenzgalerie ist in der Startseite aufgegangen:
     die Section /#projekte zeigt die Projekte mit Namen, sobald das Codewort
     gefallen ist. Die alte Galerie liegt unter _archiv/projekte.html.
     Diese Datei bleibt, weil die Adresse weitergegeben worden sein kann.

     GitHub Pages kann keine 301 ausliefern, deshalb wie bei impressum.html
     der Umweg über meta refresh, dazu ein Skript und ein sichtbarer Link. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=/#projekte">
<link rel="canonical" href="https://www.wiredframe.de/#projekte">
<meta name="robots" content="noindex, follow">
<title>Projekte | wiredframe</title>
<link rel="shortcut icon" href="images/shortcut-icon.svg" type="image/x-icon">
<meta name="theme-color" content="#e2ebe6">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#e2ebe6; color:#193239; text-align:center; padding:24px;
        font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a{ color:#193239; }
</style>
</head>
<body>
<p>Die Projekte stehen jetzt auf der Startseite.<br>
  <a href="/#projekte">Weiter zu den Projekten</a></p>
<script>location.replace('/#projekte');</script>
</body>
</html>
